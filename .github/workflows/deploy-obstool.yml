name: Deploy ObsTool

on:
  push:
    branches:
      - release

concurrency:
  group: obstool-release-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and FTP deploy
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ObsTool/ObsToolClient/package-lock.json

      - name: Install frontend dependencies
        working-directory: ObsTool/ObsToolClient
        run: npm ci

      - name: Publish integrated app
        run: dotnet publish ObsTool/ObsTool.csproj --configuration Release --self-contained false --output publish /p:EnvironmentName=Production /p:UseAppHost=false
        env:
          VITE_API_URL: /obstool/api
          VITE_BASE_PATH: /obstool/

      - name: Create app_offline marker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deployment/app-offline | Out-Null
          # Keep the marker unique so FTP deploy updates app_offline.htm and IIS sees a fresh shutdown signal.
          $offlineHtml = "<!doctype html><html><body>ObsTool deployment in progress. Run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT at $(Get-Date -Format o).</body></html>"
          $offlineHtml | Set-Content -Path deployment/app-offline/app_offline.htm -Encoding utf8
          Copy-Item -Path deployment/app-offline/app_offline.htm -Destination publish/app_offline.htm -Force

      - name: Put app offline
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deployment/app-offline/
          server-dir: /
          state-name: .ftp-deploy-offline-state.json

      - name: Wait for IIS to release files
        shell: pwsh
        run: Start-Sleep -Seconds 45

      - name: Upload published app
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: publish/
          server-dir: /
          # Keep steady-state deploys incremental. Setting this to true wipes the whole FTP server-dir before uploading.
          dangerous-clean-slate: false

      - name: Remove app_offline marker from publish folder
        shell: pwsh
        run: Remove-Item -Path publish/app_offline.htm -Force

      - name: Bring app online
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: publish/
          server-dir: /
